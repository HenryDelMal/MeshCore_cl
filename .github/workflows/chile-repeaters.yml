name: Chile repeater firmware
on:
  workflow_dispatch:
    inputs:
      board:
        description: Repeater board
        type: choice
        required: true
        options:
          - RAK_4631_repeater
          - Xiao_nrf52_repeater
          - Xiao_C3_repeater
          - Xiao_C6_repeater_
          - Xiao_S3_repeater
          - Xiao_S3_WIO_repeater
          - ProMicro_repeater
          - Heltec_v3_repeater
          - heltec_v4_repeater
          - Heltec_WSL3_repeater
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build-environment
      - name: Build repeater
        env:
          TARGET: ${{ inputs.board }}
          PLATFORMIO_BUILD_FLAGS: "-DLORA_FREQ=927.875 -DLORA_BW=62.5 -DLORA_SF=8 -DLORA_CR=5 -DMESHCHILE_REPEATER_DEFAULTS=1"
        run: |
          set -euo pipefail
          case "$TARGET" in
            RAK_4631_repeater|Xiao_nrf52_repeater|Xiao_C3_repeater|Xiao_C6_repeater_|Xiao_S3_repeater|Xiao_S3_WIO_repeater|ProMicro_repeater|Heltec_v3_repeater|heltec_v4_repeater|Heltec_WSL3_repeater) ;;
            *) exit 1 ;;
          esac
          export FIRMWARE_VERSION="v18-chile-${GITHUB_SHA:0:8}"
          bash build.sh build-firmware "$TARGET"
          case "$TARGET" in
            RAK_4631_repeater|Xiao_nrf52_repeater|ProMicro_repeater)
              test -s "out/$TARGET-$FIRMWARE_VERSION.zip"
              test -s "out/$TARGET-$FIRMWARE_VERSION.uf2"
              ;;
            *)
              test -s "out/$TARGET-$FIRMWARE_VERSION-freshInstall-merged.bin"
              test -s "out/$TARGET-$FIRMWARE_VERSION-upgrade.bin"
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: chile-${{ inputs.board }}
          path: out/*
          if-no-files-found: error
