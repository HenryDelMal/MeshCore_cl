name: Chile repeater firmware
on:
  workflow_dispatch:
    inputs:
      board:
        description: Repeater board
        type: choice
        required: true
        options:
          - RAK_4631_repeater
          - Xiao_nrf52_repeater
          - Xiao_C3_repeater
          - Xiao_C6_repeater_
          - Xiao_S3_repeater
          - Xiao_S3_WIO_repeater
          - ProMicro_repeater
          - KeepteenLT1_repeater
          - Heltec_v3_repeater
          - heltec_v4_repeater
          - Heltec_WSL3_repeater
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build-environment
      - name: Build repeater
        env:
          TARGET: ${{ inputs.board }}
          MESHCORE_ESP32_USB_INSTALL_TARGETS: "|Xiao_C3_repeater|Xiao_C6_repeater_|Xiao_S3_repeater|Xiao_S3_WIO_repeater|Heltec_v3_repeater|heltec_v4_repeater|Heltec_WSL3_repeater|"
        run: |
          set -euo pipefail
          case "$TARGET" in
            RAK_4631_repeater|Xiao_nrf52_repeater|Xiao_C3_repeater|Xiao_C6_repeater_|Xiao_S3_repeater|Xiao_S3_WIO_repeater|ProMicro_repeater|KeepteenLT1_repeater|Heltec_v3_repeater|heltec_v4_repeater|Heltec_WSL3_repeater) ;;
            *) exit 1 ;;
          esac
          if [[ "$TARGET" =~ ^(RAK_4631_repeater|Xiao_nrf52_repeater|ProMicro_repeater|KeepteenLT1_repeater)$ ]]; then
            bash build.sh build-firmware "$TARGET" --radio-preset chile --profile chile --build-profile standard --with-bootloader 2.4.12
          else
            bash build.sh build-firmware "$TARGET" --radio-preset chile --profile chile --build-profile standard
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: chile-${{ inputs.board }}
          path: out/*
          if-no-files-found: error
